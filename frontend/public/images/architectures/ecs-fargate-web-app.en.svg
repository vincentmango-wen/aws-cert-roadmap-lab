<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">ECS Fargate web app architecture</title>
  <desc id="desc">Users access ALB over HTTPS and ALB forwards traffic to ECS Fargate tasks running container images from ECR.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}
      .box{fill:#ffffff;stroke:#cbd5e1;stroke-width:2}
      .net{fill:#ecfdf5;stroke:#34d399;stroke-width:2}
      .aws{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}
      .store{fill:#fff7ed;stroke:#fb923c;stroke-width:2}
      .title{font:700 26px sans-serif;fill:#0f172a}
      .label{font:700 18px sans-serif;fill:#0f172a}
      .small{font:500 14px sans-serif;fill:#475569}
      .line{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#64748b;stroke-width:2;stroke-dasharray:8 6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1200" height="680" rx="28"/>
  <text class="title" x="60" y="58">ECS Fargate Container Web App Architecture</text>

  <rect class="box" x="58" y="110" width="1084" height="455" rx="24"/>
  <text class="label" x="86" y="150">Amazon VPC</text>

  <rect class="net" x="105" y="220" width="270" height="210" rx="18"/>
  <text class="label" x="150" y="263">Public Subnets</text>
  <rect class="aws" x="145" y="310" width="190" height="82" rx="16"/>
  <text class="label" x="185" y="358">ALB</text>

  <rect class="net" x="465" y="220" width="310" height="210" rx="18"/>
  <text class="label" x="525" y="263">Private Subnets</text>
  <rect class="aws" x="505" y="305" width="230" height="95" rx="16"/>
  <text class="label" x="552" y="345">ECS Service</text>
  <text class="small" x="562" y="373">Fargate Tasks</text>

  <rect class="store" x="865" y="205" width="220" height="90" rx="16"/>
  <text class="label" x="920" y="247">Amazon ECR</text>
  <text class="small" x="930" y="273">Container Images</text>

  <rect class="box" x="865" y="365" width="220" height="90" rx="16"/>
  <text class="label" x="910" y="407">CloudWatch</text>
  <text class="small" x="945" y="433">Logs</text>

  <rect class="box" x="105" y="95" width="270" height="72" rx="16"/>
  <text class="label" x="176" y="138">Route 53 + ACM</text>

  <path class="line" d="M240 167 V310"/>
  <path class="line" d="M335 351 H505"/>
  <path class="dash" d="M735 330 C790 285 805 250 865 250"/>
  <path class="dash" d="M735 380 C795 405 815 410 865 410"/>
  <text class="small" x="92" y="610">Point: Expose only the ALB and run ECS tasks in private subnets</text>
</svg>
