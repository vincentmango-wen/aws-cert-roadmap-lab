<svg xmlns="http://www.w3.org/2000/svg" width="640" height="2250" viewBox="0 0 640 2250" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">SNS + SQS fan-out</title>
<desc id="desc">Independent consumers. Permissions and DLQ configuration are explained in the flow table.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#334155"/></marker></defs>
<rect width="640" height="2250" rx="24" fill="#f8fafc"/>
<g font-family="Arial, Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" fill="#0f172a">
<text x="320" y="50" text-anchor="middle" font-size="34">SNS + SQS fan-out</text>
<g id="app"><rect x="90" y="90" width="460" height="100" rx="14" fill="#eff6ff" stroke="#64748b" stroke-width="2"/>
<text x="320.0" y="150.0" text-anchor="middle" font-size="30">Application</text>
</g>
<path d="M320 190 V270" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<text x="460" y="238" text-anchor="middle" font-size="26">Publish</text>
<g id="topic"><rect x="90" y="270" width="460" height="100" rx="14" fill="#eff6ff" stroke="#64748b" stroke-width="2"/>
<text x="320.0" y="330.0" text-anchor="middle" font-size="30">Amazon SNS Topic</text>
</g>
<text x="320" y="430" text-anchor="middle" font-size="28">Subscription delivery</text>
<path d="M90 320 H40 V1670" fill="none" stroke="#334155" stroke-width="3"/>
<text x="365" y="512" text-anchor="middle" font-size="32">Notifications</text>
<g id="queue-0"><rect x="130" y="540" width="470" height="100" rx="14" fill="#eff6ff" stroke="#64748b" stroke-width="2"/>
<text x="365.0" y="600.0" text-anchor="middle" font-size="30">SQS queue</text>
</g>
<path d="M40 590 H130" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M365 640 V680" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<g id="mapping-0"><rect x="130" y="680" width="470" height="120" rx="14" fill="#eff6ff" stroke="#64748b" stroke-width="2"/>
<text x="365.0" y="732.0" text-anchor="middle" font-size="30">Lambda event source</text>
<text x="365.0" y="768.0" text-anchor="middle" font-size="30">mapping (polling)</text>
</g>
<text x="365" y="837" text-anchor="middle" font-size="26">Synchronous invocation</text>
<path d="M365 846 V880" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<g id="worker-0"><rect x="130" y="880" width="470" height="100" rx="14" fill="#eff6ff" stroke="#64748b" stroke-width="2"/>
<text x="365.0" y="940.0" text-anchor="middle" font-size="30">Lambda worker</text>
</g>
<text x="365" y="1052" text-anchor="middle" font-size="32">Inventory</text>
<g id="queue-1"><rect x="130" y="1080" width="470" height="100" rx="14" fill="#eff6ff" stroke="#64748b" stroke-width="2"/>
<text x="365.0" y="1140.0" text-anchor="middle" font-size="30">SQS queue</text>
</g>
<path d="M40 1130 H130" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M365 1180 V1220" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<g id="mapping-1"><rect x="130" y="1220" width="470" height="120" rx="14" fill="#eff6ff" stroke="#64748b" stroke-width="2"/>
<text x="365.0" y="1272.0" text-anchor="middle" font-size="30">Lambda event source</text>
<text x="365.0" y="1308.0" text-anchor="middle" font-size="30">mapping (polling)</text>
</g>
<text x="365" y="1377" text-anchor="middle" font-size="26">Synchronous invocation</text>
<path d="M365 1386 V1420" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<g id="worker-1"><rect x="130" y="1420" width="470" height="100" rx="14" fill="#eff6ff" stroke="#64748b" stroke-width="2"/>
<text x="365.0" y="1480.0" text-anchor="middle" font-size="30">Lambda worker</text>
</g>
<text x="365" y="1592" text-anchor="middle" font-size="32">Analytics</text>
<g id="queue-2"><rect x="130" y="1620" width="470" height="100" rx="14" fill="#eff6ff" stroke="#64748b" stroke-width="2"/>
<text x="365.0" y="1680.0" text-anchor="middle" font-size="30">SQS queue</text>
</g>
<path d="M40 1670 H130" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M365 1720 V1760" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<g id="mapping-2"><rect x="130" y="1760" width="470" height="120" rx="14" fill="#eff6ff" stroke="#64748b" stroke-width="2"/>
<text x="365.0" y="1812.0" text-anchor="middle" font-size="30">Lambda event source</text>
<text x="365.0" y="1848.0" text-anchor="middle" font-size="30">mapping (polling)</text>
</g>
<text x="365" y="1917" text-anchor="middle" font-size="26">Synchronous invocation</text>
<path d="M365 1926 V1960" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<g id="worker-2"><rect x="130" y="1960" width="470" height="100" rx="14" fill="#eff6ff" stroke="#64748b" stroke-width="2"/>
<text x="365.0" y="2020.0" text-anchor="middle" font-size="30">Lambda worker</text>
</g>
<text x="320" y="2160" text-anchor="middle" font-size="28">Permissions and DLQ configuration</text>
<text x="320" y="2196" text-anchor="middle" font-size="28">are explained in the flow table.</text>
</g>
</svg>
