<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ja" viewBox="0 0 774 404" width="774" height="404" role="img" aria-labelledby="title-desktop desc-desktop">
<title id="title-desktop">SNS + SQS ファンアウト</title><desc id="desc-desktop">アプリが SNS に発行し、購読キューごとに Lambda イベントソースマッピングがポーリングして関数を同期呼び出しします。分岐間に実行順序はありません。権限、ログ、DLQ 設定はフロー表を参照してください。</desc>
<style>text{font-family:Arial,'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif;fill:#17253a}.heading{font-weight:700;font-size:19px}.note{font-size:13px;fill:#445469}.wire{fill:none;stroke:#445469;stroke-width:2}.lane{fill:#f8fafc;stroke:#d8e1eb}.label,.sub{text-anchor:middle}.label{font-size:15px;font-weight:600}.sub{font-size:12px;fill:#394a60}.branch{font-size:14px;font-weight:700}.neutral{fill:#fff;stroke:#aab9cb}.sns{fill:#ede9fe;stroke:#8b5cf6}.sqs{fill:#fef3c7;stroke:#b3670c}.lambda,.mapping{fill:#eff6ff;stroke:#6098db}.mapping{stroke-dasharray:4 3}</style><defs><marker id="arrow-desktop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#445469"/></marker></defs>
<text x="22" y="30" class="heading">SNS + SQS ファンアウト</text><text x="22" y="54" class="note">1 イベントを 3 つの購読キューへ配信し、各分岐で独立処理</text>
<path class="wire" d="M164 241 H201 M201 120 V362"/><path class="wire" d="M78 185 V209" marker-end="url(#arrow-desktop)"/><text x="94" y="201" class="note">発行</text>
<rect class="neutral" x="22" y="131" width="112" height="54" rx="11"/><text class="sub" x="78.0" y="163.0">アプリケーション</text><rect class="sns" x="22" y="209" width="142" height="64" rx="11"/><text class="label" x="93.0" y="239.0">Amazon SNS</text><text class="sub" x="93.0" y="259.0">Topic</text><rect class="lane" x="218" y="67" width="538" height="87" rx="11"/>
<rect x="230" y="73" width="4" height="15" rx="2" fill="#0e766e"/><text x="241" y="85" class="branch">通知</text>
<circle cx="201" cy="120" r="3.5" fill="#445469"/>
<path class="wire" d="M201 120 H230" marker-end="url(#arrow-desktop)"/><path class="wire" d="M431 120 H352" marker-end="url(#arrow-desktop)"/><path class="wire" d="M554 120 H635" marker-end="url(#arrow-desktop)"/>
