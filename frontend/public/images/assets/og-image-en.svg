    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="0" fill="url(#backgroundGradient)"/>

  <circle cx="1010" cy="110" r="210" fill="#38BDF8" opacity="0.08"/>
