<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="365" viewBox="0 0 1000 365" role="img" aria-labelledby="diagram-title diagram-description" xml:lang="zh">
  <title id="diagram-title">聯絡表單：載入靜態頁面與送出 API 請求</title>
  <desc id="diagram-description">瀏覽器先從 CloudFront 載入表單，再另向 HTTP API 送出 POST /contact。Lambda 驗證後寫入 DynamoDB。</desc>
  <defs>
    <marker id="arrow-viewer" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8z" fill="#075985"/></marker>
    <marker id="arrow-origin" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8z" fill="#047857"/></marker>
    <marker id="arrow-dns" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8z" fill="#6d28d9"/></marker>
    <marker id="arrow-tls" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8z" fill="#a21caf"/></marker>
    <marker id="arrow-deployment" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8z" fill="#92400e"/></marker>
    <marker id="arrow-form-load" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8z" fill="#075985"/></marker>
    <marker id="arrow-submit" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8z" fill="#075985"/></marker>
    <marker id="arrow-invoke" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8z" fill="#6d28d9"/></marker>
    <marker id="arrow-write" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8z" fill="#047857"/></marker>
  </defs>
  <rect width="1000" height="365" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="32" y="42" font-size="25" font-weight="700" text-anchor="start" fill="#0f172a">聯絡表單：載入靜態頁面與送出 API 請求</text>
    <rect x="24" y="75" width="952" height="95" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="24" y="185" width="952" height="143" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <path data-from="browser" data-to="frontend" data-relationship="form-load" d="M192 221H221V126H322" fill="none" stroke="#075985" stroke-width="2.5" marker-end="url(#arrow-form-load)"/>
    <text x="260" y="113" font-size="15" font-weight="600" text-anchor="middle" fill="#075985">1 · 載入表單</text>
    <path data-from="browser" data-to="http-api" data-relationship="submit" d="M192 251H322" fill="none" stroke="#075985" stroke-width="2.5" marker-end="url(#arrow-submit)"/>
    <text x="257" y="237" font-size="15" font-weight="600" text-anchor="middle" fill="#075985">2 · POST /contact</text>
    <path data-from="http-api" data-to="lambda" data-relationship="invoke" d="M473 251H557" fill="none" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#arrow-invoke)"/>
    <text x="516" y="206" font-size="15" font-weight="600" text-anchor="middle" fill="#6d28d9">代理呼叫</text>
    <path data-from="lambda" data-to="dynamodb" data-relationship="write" d="M708 251H802" fill="none" stroke="#047857" stroke-width="2.5" marker-end="url(#arrow-write)"/>
    <text x="755" y="237" font-size="15" font-weight="600" text-anchor="middle" fill="#047857">PutItem</text>
    <g id="browser">
    <rect x="40" y="216" width="152" height="70" rx="12" fill="#e0f2fe" stroke="#64748b"/>
    <text x="116" y="244" font-size="17" font-weight="600" text-anchor="middle" fill="#0f172a">瀏覽器</text>
    <text x="116" y="267" font-size="15" font-weight="500" text-anchor="middle" fill="#334155">網站訪客</text>
    </g>
    <g id="frontend">
    <rect x="322" y="92" width="151" height="70" rx="12" fill="#e0f2fe" stroke="#64748b"/>
    <text x="397" y="120" font-size="17" font-weight="600" text-anchor="middle" fill="#0f172a">靜態表單</text>
    <text x="397" y="143" font-size="15" font-weight="500" text-anchor="middle" fill="#334155">S3＋CloudFront</text>
    </g>
    <g id="http-api">
    <rect x="322" y="216" width="151" height="70" rx="12" fill="#ede9fe" stroke="#64748b"/>
    <text x="397" y="244" font-size="17" font-weight="600" text-anchor="middle" fill="#0f172a">API Gateway</text>
    <text x="397" y="267" font-size="15" font-weight="500" text-anchor="middle" fill="#334155">HTTP API</text>
    </g>
    <g id="lambda">
    <rect x="557" y="216" width="151" height="70" rx="12" fill="#fef3c7" stroke="#64748b"/>
    <text x="632" y="244" font-size="17" font-weight="600" text-anchor="middle" fill="#0f172a">AWS Lambda</text>
    <text x="632" y="267" font-size="15" font-weight="500" text-anchor="middle" fill="#334155">contact-submit</text>
    </g>
    <g id="dynamodb">
    <rect x="802" y="216" width="151" height="70" rx="12" fill="#d1fae5" stroke="#64748b"/>
    <text x="877" y="244" font-size="17" font-weight="600" text-anchor="middle" fill="#0f172a">DynamoDB</text>
    <text x="877" y="267" font-size="15" font-weight="500" text-anchor="middle" fill="#334155">ContactsTable</text>
    </g>
  </g>
</svg>
