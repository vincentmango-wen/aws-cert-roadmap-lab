<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="820" viewBox="0 0 1000 820" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">CloudWatch monitoring</title>
<desc id="desc">The diagram above separates requests, monitoring signals, and notifications. Read each path as follows.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#334155"/></marker></defs>
<rect width="1000" height="820" rx="20" fill="#f8fafc"/>
<g font-family="Arial, 'Yu Gothic', 'Microsoft JhengHei', sans-serif" fill="#0f172a" font-size="15">
<text x="500" y="35" text-anchor="middle" font-size="22" font-weight="400">CloudWatch monitoring</text>
<rect x="13.3333" y="60" width="973.333" height="235" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="500" y="85" text-anchor="middle" font-size="17" font-weight="400">Requests and data</text>
<g id="user">
<rect x="29.1667" y="160" width="116.667" height="66" rx="12" fill="#eff6ff" stroke="#60a5fa"/>
<text x="87.5" y="198.0" text-anchor="middle" font-size="15" font-weight="600">User</text>
</g>
<g id="cloudfront">
<rect x="241.667" y="105" width="158.333" height="66" rx="12" fill="#eff6ff" stroke="#60a5fa"/>
<text x="320.833" y="143.0" text-anchor="middle" font-size="15" font-weight="600">CloudFront</text>
</g>
<g id="s3">
<rect x="483.333" y="105" width="158.333" height="66" rx="12" fill="#ecfdf5" stroke="#34d399"/>
<text x="562.5" y="143.0" text-anchor="middle" font-size="15" font-weight="600">S3</text>
</g>
<g id="api-gateway">
<rect x="241.667" y="210" width="158.333" height="66" rx="12" fill="#ede9fe" stroke="#8b5cf6"/>
<text x="320.833" y="248.0" text-anchor="middle" font-size="15" font-weight="600">API Gateway</text>
</g>
<g id="lambda">
<rect x="483.333" y="210" width="158.333" height="66" rx="12" fill="#eff6ff" stroke="#60a5fa"/>
<text x="562.5" y="248.0" text-anchor="middle" font-size="15" font-weight="600">Lambda</text>
</g>
<g id="dynamodb">
<rect x="750" y="210" width="158.333" height="66" rx="12" fill="#ecfdf5" stroke="#34d399"/>
<text x="829.167" y="248.0" text-anchor="middle" font-size="15" font-weight="600">DynamoDB</text>
</g>
<path data-from="user" data-to="cloudfront" d="M145.833 193 H191.667 V138 H241.667" fill="none" stroke="#334155" stroke-width="1.66667" marker-end="url(#arrow)"/>
<path data-from="user" data-to="api-gateway" d="M191.667 193 V243 H241.667" fill="none" stroke="#334155" stroke-width="1.66667" marker-end="url(#arrow)"/>
<path data-from="cloudfront" data-to="s3" d="M400 138 H483.333" fill="none" stroke="#334155" stroke-width="1.66667" marker-end="url(#arrow)"/>
<path data-from="api-gateway" data-to="lambda" d="M400 243 H483.333" fill="none" stroke="#334155" stroke-width="1.66667" marker-end="url(#arrow)"/>
<path data-from="lambda" data-to="dynamodb" d="M641.667 243 H750" fill="none" stroke="#334155" stroke-width="1.66667" marker-end="url(#arrow)"/>
<rect x="13.3333" y="310" width="973.333" height="220" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="500" y="335" text-anchor="middle" font-size="17" font-weight="400">Logs and metrics</text>
<g id="metric-sources">
<rect x="29.1667" y="350" width="266.667" height="72" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="162.5" y="381.0" text-anchor="middle" font-size="15" font-weight="600">CloudFront / API Gateway</text>
<text x="162.5" y="401.0" text-anchor="middle" font-size="15" font-weight="400">Lambda / DynamoDB</text>
</g>
<g id="metrics">
<rect x="583.333" y="350" width="225" height="72" rx="12" fill="#ede9fe" stroke="#8b5cf6"/>
<text x="695.833" y="391.0" text-anchor="middle" font-size="15" font-weight="600">CloudWatch Metrics</text>
</g>
<path data-from="metric-sources" data-to="metrics" d="M295.833 386 H583.333" fill="none" stroke="#334155" stroke-width="1.66667" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="437.5" y="374" text-anchor="middle" font-size="15" font-weight="400">Service metrics</text>
<g id="log-source">
<rect x="29.1667" y="445" width="266.667" height="60" rx="12" fill="#eff6ff" stroke="#60a5fa"/>
<text x="162.5" y="480.0" text-anchor="middle" font-size="15" font-weight="600">Lambda</text>
</g>
<g id="logs">
<rect x="583.333" y="445" width="225" height="60" rx="12" fill="#ede9fe" stroke="#8b5cf6"/>
<text x="695.833" y="480.0" text-anchor="middle" font-size="15" font-weight="600">CloudWatch Logs</text>
</g>
<path data-from="log-source" data-to="logs" d="M295.833 475 H583.333" fill="none" stroke="#334155" stroke-width="1.66667" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="437.5" y="463" text-anchor="middle" font-size="15" font-weight="400">Log output</text>
<rect x="13.3333" y="545" width="973.333" height="200" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="500" y="570" text-anchor="middle" font-size="17" font-weight="400">Cost and CI/CD notifications</text>
<g id="budgets">
<rect x="29.1667" y="590" width="191.667" height="60" rx="12" fill="#fef3c7" stroke="#f59e0b"/>
<text x="125" y="625.0" text-anchor="middle" font-size="15" font-weight="600">AWS Budgets</text>
</g>
<g id="github">
<rect x="29.1667" y="670" width="191.667" height="60" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="125" y="705.0" text-anchor="middle" font-size="15" font-weight="600">GitHub Actions</text>
</g>
<g id="developer">
<rect x="750" y="630" width="191.667" height="60" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="845.833" y="665.0" text-anchor="middle" font-size="15" font-weight="600">Developer</text>
</g>
<path data-from="budgets" data-to="developer" d="M220.833 620 H666.667 V650 H750" fill="none" stroke="#334155" stroke-width="1.66667" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<path data-from="github" data-to="developer" d="M220.833 700 H683.333 V670 H750" fill="none" stroke="#334155" stroke-width="1.66667" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="416.667" y="607" text-anchor="middle" font-size="15" font-weight="400">Email</text>
<text x="395.833" y="680" text-anchor="middle" font-size="15" font-weight="400">CI/CD</text>
<text x="462.5" y="680" text-anchor="middle" font-size="15" font-weight="400">results</text>
<text x="500" y="775" text-anchor="middle" font-size="15" font-weight="400">Developer views Logs / Metrics</text>
<text x="500" y="800" text-anchor="middle" font-size="15" font-weight="400">Notifications are separate from requests</text>
</g>
</svg>
