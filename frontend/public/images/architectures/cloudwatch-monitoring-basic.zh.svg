<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1920" viewBox="0 0 640 1920" role="img" aria-labelledby="title desc" xml:lang="zh-Hant">
<title id="title">CloudWatch 維運監控</title>
<desc id="desc">上圖將請求、監控資訊與通知分開呈現，各路徑的意義如下。</desc>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
<path d="M0 0 L9 4.5 L0 9 Z" fill="#334155"/>
</marker>
</defs>
<rect width="640" height="1920" rx="24" fill="#f8fafc"/>
<g font-family="Arial, 'Yu Gothic', 'Microsoft JhengHei', sans-serif" fill="#0f172a">
<text x="320" y="48" text-anchor="middle" font-size="30">CloudWatch 維運監控</text>
<text x="320" y="96" text-anchor="middle" font-size="26">請求與資料</text>
<g id="user">
<rect x="200" y="130" width="240" height="80" rx="16" fill="#eff6ff" stroke="#64748b" stroke-width="2"/>
<text x="320" y="178" text-anchor="middle" font-size="24">使用者</text>
</g>
<path d="M320 210 V240 H165 V280" fill="none" stroke="#334155" stroke-width="3"  marker-end="url(#arrow)"/>
<path d="M320 240 H475 V280" fill="none" stroke="#334155" stroke-width="3"  marker-end="url(#arrow)"/>
<g id="cloudfront">
<rect x="40" y="280" width="250" height="80" rx="16" fill="#eff6ff" stroke="#64748b" stroke-width="2"/>
<text x="165" y="328" text-anchor="middle" font-size="24">CloudFront</text>
</g>
<g id="api-gateway">
<rect x="350" y="280" width="250" height="80" rx="16" fill="#eff6ff" stroke="#64748b" stroke-width="2"/>
<text x="475" y="328" text-anchor="middle" font-size="24">API Gateway</text>
</g>
<path d="M165 360 V410" fill="none" stroke="#334155" stroke-width="3"  marker-end="url(#arrow)"/>
<path d="M475 360 V410" fill="none" stroke="#334155" stroke-width="3"  marker-end="url(#arrow)"/>
<g id="s3">
<rect x="40" y="410" width="250" height="80" rx="16" fill="#eff6ff" stroke="#64748b" stroke-width="2"/>
<text x="165" y="458" text-anchor="middle" font-size="24">S3</text>
</g>
<g id="lambda">
<rect x="350" y="410" width="250" height="80" rx="16" fill="#eff6ff" stroke="#64748b" stroke-width="2"/>
<text x="475" y="458" text-anchor="middle" font-size="24">Lambda</text>
</g>
<path d="M475 490 V550" fill="none" stroke="#334155" stroke-width="3"  marker-end="url(#arrow)"/>
<g id="dynamodb">
<rect x="350" y="550" width="250" height="80" rx="16" fill="#eff6ff" stroke="#64748b" stroke-width="2"/>
<text x="475" y="598" text-anchor="middle" font-size="24">DynamoDB</text>
</g>
<text x="320" y="710" text-anchor="middle" font-size="26">日誌與指標</text>
<g id="metric-sources">
<rect x="60" y="750" width="520" height="110" rx="16" fill="#eff6ff" stroke="#64748b" stroke-width="2"/>
<text x="320" y="797" text-anchor="middle" font-size="24">CloudFront / API Gateway</text>
<text x="320" y="829" text-anchor="middle" font-size="24">Lambda / DynamoDB</text>
</g>
<path d="M320 860 V950" fill="none" stroke="#0369a1" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#arrow)"/>
<text x="460" y="904" text-anchor="middle" font-size="24">服務指標</text>
<g id="metrics">
<rect x="60" y="950" width="520" height="80" rx="16" fill="#ecfdf5" stroke="#64748b" stroke-width="2"/>
<text x="320" y="998" text-anchor="middle" font-size="24">CloudWatch Metrics</text>
</g>
<g id="log-source">
<rect x="60" y="1090" width="520" height="80" rx="16" fill="#eff6ff" stroke="#64748b" stroke-width="2"/>
<text x="320" y="1138" text-anchor="middle" font-size="24">Lambda</text>
</g>
<path d="M320 1170 V1260" fill="none" stroke="#0369a1" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#arrow)"/>
<text x="460" y="1214" text-anchor="middle" font-size="24">日誌輸出</text>
<g id="logs">
<rect x="60" y="1260" width="520" height="80" rx="16" fill="#ecfdf5" stroke="#64748b" stroke-width="2"/>
<text x="320" y="1308" text-anchor="middle" font-size="24">CloudWatch Logs</text>
</g>
<text x="320" y="1420" text-anchor="middle" font-size="26">費用與 CI/CD 通知</text>
<g id="budgets">
<rect x="40" y="1460" width="250" height="90" rx="16" fill="#fff7ed" stroke="#64748b" stroke-width="2"/>
<text x="165" y="1513" text-anchor="middle" font-size="24">AWS Budgets</text>
</g>
<g id="github">
<rect x="350" y="1460" width="250" height="90" rx="16" fill="#fff7ed" stroke="#64748b" stroke-width="2"/>
<text x="475" y="1513" text-anchor="middle" font-size="24">GitHub Actions</text>
</g>
<path d="M165 1550 V1660 H270 V1710" fill="none" stroke="#0369a1" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#arrow)"/>
<path d="M475 1550 V1660 H370 V1710" fill="none" stroke="#0369a1" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#arrow)"/>
<text x="235" y="1600" text-anchor="middle" font-size="24">電子郵件</text>
<text x="550" y="1600" text-anchor="middle" font-size="24">CI/CD 結果</text>
<g id="developer">
<rect x="200" y="1710" width="240" height="80" rx="16" fill="#eff6ff" stroke="#64748b" stroke-width="2"/>
<text x="320" y="1758" text-anchor="middle" font-size="24">開發者</text>
</g>
<text x="320" y="1840" text-anchor="middle" font-size="24">開發者檢視 Logs / Metrics</text>
<text x="320" y="1872" text-anchor="middle" font-size="24">通知與請求使用不同路徑</text>
</g>
</svg>
