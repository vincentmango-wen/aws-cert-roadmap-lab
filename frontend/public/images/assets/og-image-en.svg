<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AWS Cert Roadmap Lab English OGP Image</title>
  <desc id="desc">English Open Graph image for AWS Cert Roadmap Lab.</desc>

  <defs>
    <linearGradient id="backgroundGradient" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.55" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="accentGradient" x1="110" y1="110" x2="1050" y2="550" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F97316"/>
      <stop offset="0.48" stop-color="#F59E0B"/>
