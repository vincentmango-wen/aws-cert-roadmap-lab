<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
<style>text{font-family:system-ui,"Noto Sans CJK TC",sans-serif;fill:#17293A}</style>
<title id="title">AWS Backup のクロスアカウント復旧：隔離環境で EBS のデータを検証</title><desc id="description">東京リージョンで本番 EBS のバックアップを別アカウントへコピーし、隔離環境でデータとアプリを検証します。 本番 EBS → ソースボールト → 宛先ボールト → 新しい EBS → データ・アプリ検証</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#25374A"/></marker></defs>
<rect x="1" y="1" width="1198" height="298" rx="18" fill="#F8FAFC" stroke="#CBD5E1"/>
<text x="28" y="38" font-size="19" font-weight="700">東京リージョン  ap-northeast-1  ·  同一の AWS Organizations 組織</text>
<rect x="15" y="58" width="434" height="223" rx="16" fill="#EFF6FF" stroke="#7AA5CF"/>
<rect x="502" y="58" width="683" height="223" rx="16" fill="#F0FDF4" stroke="#7CA891"/>
<text x="28" y="86" font-weight="700">本番アカウント</text><text x="520" y="86" font-weight="700">バックアップアカウント</text>
<rect id="isolated-test" x="739" y="104" width="431" height="160" rx="14" fill="none" stroke="#5D786E" stroke-dasharray="7 5"/>
<text x="755" y="252" font-size="13" font-weight="700">隔離テスト環境</text>
<text id="source-kms" x="28" y="263" font-size="13" font-weight="700">ソース KMS カスタマーマネージドキー</text>
<text id="destination-kms" x="520" y="263" font-size="11" font-weight="700">宛先 KMS カスタマーマネージドキー</text>
<g id="A"><rect x="28" y="154" width="177" height="76" rx="13" fill="#DCEBFF" stroke="#516477"/><text x="116" y="181" text-anchor="middle" font-size="16" font-weight="700">A · 本番 EBS</text><text x="116" y="207" text-anchor="middle" font-size="13">暗号化データボリューム</text></g>
<g id="B"><rect x="260" y="154" width="177" height="76" rx="13" fill="#EDE3FA" stroke="#516477"/><text x="348" y="181" text-anchor="middle" font-size="16" font-weight="700">B · ソースボールト</text><text x="348" y="207" text-anchor="middle" font-size="13">元の復旧ポイント</text></g>
<g id="C"><rect x="520" y="154" width="177" height="76" rx="13" fill="#EDE3FA" stroke="#516477"/><text x="608" y="181" text-anchor="middle" font-size="16" font-weight="700">C · 宛先ボールト</text><text x="608" y="207" text-anchor="middle" font-size="13">コピー済み復旧ポイント</text></g>
<g id="D"><rect x="754" y="154" width="177" height="76" rx="13" fill="#FFF1CF" stroke="#516477"/><text x="842" y="181" text-anchor="middle" font-size="16" font-weight="700">D · 新しい EBS</text><text x="842" y="207" text-anchor="middle" font-size="13">テスト EC2 と同じ AZ</text></g>
<g id="E"><rect x="988" y="154" width="177" height="76" rx="13" fill="#D9F4E3" stroke="#516477"/><text x="1076" y="181" text-anchor="middle" font-size="16" font-weight="700">E · データ検証</text><text x="1076" y="207" text-anchor="middle" font-size="13">アプリ読取・照合</text></g>
<g data-step="backup"><path d="M 205 190 H 257" fill="none" stroke="#25374A" stroke-width="2" marker-end="url(#arrow)"/><path d="M 231 185 V 142" stroke="#526778" stroke-dasharray="3 3"/><rect x="152" y="114" width="158" height="25" rx="7" fill="#FFFFFF" stroke="#9BA9B7"/><text x="231" y="132" text-anchor="middle" font-size="12" font-weight="700">バックアップ</text></g>
<g data-step="copy"><path d="M 437 190 H 517" fill="none" stroke="#25374A" stroke-width="2" marker-end="url(#arrow)"/><path d="M 477 185 V 142" stroke="#526778" stroke-dasharray="3 3"/><rect x="398" y="114" width="158" height="25" rx="7" fill="#FFFFFF" stroke="#9BA9B7"/><text x="477" y="132" text-anchor="middle" font-size="12" font-weight="700">アカウント間コピー</text></g>
<g data-step="restore"><path d="M 697 190 H 751" fill="none" stroke="#25374A" stroke-width="2" marker-end="url(#arrow)"/><path d="M 724 185 V 142" stroke="#526778" stroke-dasharray="3 3"/><rect x="645" y="114" width="158" height="25" rx="7" fill="#FFFFFF" stroke="#9BA9B7"/><text x="724" y="132" text-anchor="middle" font-size="12" font-weight="700">復元</text></g>
<g data-step="validate"><path d="M 931 190 H 985" fill="none" stroke="#25374A" stroke-width="2" marker-end="url(#arrow)"/><path d="M 958 185 V 142" stroke="#526778" stroke-dasharray="3 3"/><rect x="879" y="114" width="158" height="25" rx="7" fill="#FFFFFF" stroke="#9BA9B7"/><text x="958" y="132" text-anchor="middle" font-size="12" font-weight="700">検証</text></g>
</svg>
