<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" viewBox="0 0 774 404" width="774" height="404" role="img" aria-labelledby="title-desktop desc-desktop">
<title id="title-desktop">SNS + SQS fan-out</title><desc id="desc-desktop">Application publishes to SNS. Each subscribed SQS queue is polled by its Lambda event source mapping, which synchronously invokes its worker. Branches are independent, not sequential. Permissions, logs and DLQ configuration are in the flow table.</desc>
<style>text{font-family:Arial,'Noto Sans CJK TC','Noto Sans CJK JP',sans-serif;fill:#17253a}.heading{font-weight:700;font-size:19px}.note{font-size:13px;fill:#445469}.wire{fill:none;stroke:#445469;stroke-width:2}.lane{fill:#f8fafc;stroke:#d8e1eb}.label,.sub{text-anchor:middle}.label{font-size:15px;font-weight:600}.sub{font-size:12px;fill:#394a60}.branch{font-size:14px;font-weight:700}.neutral{fill:#fff;stroke:#aab9cb}.sns{fill:#ede9fe;stroke:#8b5cf6}.sqs{fill:#fef3c7;stroke:#b3670c}.lambda,.mapping{fill:#eff6ff;stroke:#6098db}.mapping{stroke-dasharray:4 3}</style><defs><marker id="arrow-desktop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#445469"/></marker></defs>
<text x="22" y="30" class="heading">SNS + SQS fan-out</text><text x="22" y="54" class="note">One event, three subscriptions; independent consumers</text>
<path class="wire" d="M164 241 H201 M201 120 V362"/><path class="wire" d="M78 185 V209" marker-end="url(#arrow-desktop)"/><text x="94" y="201" class="note">Publish</text>
