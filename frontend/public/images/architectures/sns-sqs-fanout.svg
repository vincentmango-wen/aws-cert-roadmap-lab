<text class="sub" x="391" y="231">ポーリング</text><text class="sub" x="595" y="231">同期呼び出し</text><rect class="sqs" x="230" y="220" width="122" height="42" rx="11"/><text class="label" x="291.0" y="246.0">SQS キュー</text><rect class="mapping" x="431" y="218" width="123" height="46" rx="11"/><text class="sub" x="492.5" y="240.0">イベントソース</text><text class="sub" x="492.5" y="255.0">マッピング</text><rect class="lambda" x="635" y="220" width="108" height="42" rx="11"/><text class="sub" x="689.0" y="246.0">Lambda 関数</text><rect class="lane" x="218" y="309" width="538" height="87" rx="11"/>
