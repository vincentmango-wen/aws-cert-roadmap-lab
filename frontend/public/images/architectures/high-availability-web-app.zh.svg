<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1880" viewBox="0 0 640 1880" role="img" aria-labelledby="title desc" xml:lang="zh-Hant">
<title id="title">高可用性 Web 應用程式</title>
<desc id="desc">上圖的 AZ-A／AZ-B 是不同可用區域的示意名稱。資料庫採用單一 Standby 的 Multi-AZ DB instance，並非 Multi-AZ DB cluster。</desc>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
<path d="M0 0 L9 4.5 L0 9 Z" fill="#334155"/>
</marker>
</defs>
<rect width="640" height="1880" rx="24" fill="#f8fafc"/>
<g font-family="Arial, 'Yu Gothic', 'Microsoft JhengHei', sans-serif" fill="#0f172a">
<text x="320" y="48" text-anchor="middle" font-size="28">高可用性 Web 應用程式</text>
<g id="user">
<rect x="200" y="100" width="240" height="80" rx="16" fill="#eff6ff" stroke="#64748b" stroke-width="2"/>
<text x="320" y="148" text-anchor="middle" font-size="24">使用者</text>
</g>
<path d="M320 180 V290" fill="none" stroke="#334155" stroke-width="3"  marker-end="url(#arrow)"/>
<text x="400" y="240" text-anchor="middle" font-size="24">HTTPS</text>
<g id="alb">
<rect x="160" y="290" width="320" height="90" rx="16" fill="#eff6ff" stroke="#64748b" stroke-width="2"/>
<text x="320" y="343" text-anchor="middle" font-size="24">ALB</text>
</g>
<rect x="40" y="450" width="250" height="750" rx="20" fill="#eff6ff" stroke="#93c5fd"/>
<rect x="350" y="450" width="250" height="750" rx="20" fill="#ecfeff" stroke="#67e8f9"/>
<text x="165" y="486" text-anchor="middle" font-size="24">AZ-A</text>
<text x="475" y="486" text-anchor="middle" font-size="24">AZ-B</text>
<rect x="25" y="510" width="590" height="280" rx="20" fill="none" stroke="#7c3aed" stroke-width="3" stroke-dasharray="10 6"/>
<text x="320" y="550" text-anchor="middle" font-size="26">一個 Auto Scaling Group</text>
<path d="M320 380 V415 H15 V600 H165 V630" fill="none" stroke="#334155" stroke-width="3"  marker-end="url(#arrow)"/>
<path d="M320 415 H625 V600 H475 V630" fill="none" stroke="#334155" stroke-width="3"  marker-end="url(#arrow)"/>
<g id="ec2-a">
<rect x="65" y="630" width="200" height="90" rx="16" fill="#eff6ff" stroke="#64748b" stroke-width="2"/>
<text x="165" y="667" text-anchor="middle" font-size="24">EC2</text>
<text x="165" y="699" text-anchor="middle" font-size="24">私有子網路</text>
</g>
<g id="ec2-b">
<rect x="375" y="630" width="200" height="90" rx="16" fill="#eff6ff" stroke="#64748b" stroke-width="2"/>
<text x="475" y="667" text-anchor="middle" font-size="24">EC2</text>
<text x="475" y="699" text-anchor="middle" font-size="24">私有子網路</text>
</g>
<path d="M165 720 V1000" fill="none" stroke="#334155" stroke-width="3"  marker-end="url(#arrow)"/>
<path d="M475 720 V910 H210 V1000" fill="none" stroke="#334155" stroke-width="3"  marker-end="url(#arrow)"/>
<text x="320" y="835" text-anchor="middle" font-size="24">兩台 EC2</text>
<text x="320" y="875" text-anchor="middle" font-size="24">均連線至 Primary</text>
<g id="primary">
<rect x="65" y="1000" width="200" height="110" rx="16" fill="#ecfdf5" stroke="#64748b" stroke-width="2"/>
<text x="165" y="1047" text-anchor="middle" font-size="24">RDS Primary</text>
<text x="165" y="1079" text-anchor="middle" font-size="24">私有子網路</text>
</g>
<g id="standby">
<rect x="375" y="1000" width="200" height="110" rx="16" fill="#ecfdf5" stroke="#64748b" stroke-width="2"/>
<text x="475" y="1047" text-anchor="middle" font-size="24">RDS Standby</text>
<text x="475" y="1079" text-anchor="middle" font-size="24">不提供讀取</text>
</g>
<path d="M265 1055 H375" fill="none" stroke="#0369a1" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#arrow)"/>
<text x="320" y="1152" text-anchor="middle" font-size="24">同步複寫</text>
<text x="320" y="1260" text-anchor="middle" font-size="24">資料庫故障時自動容錯切換</text>
<text x="320" y="1292" text-anchor="middle" font-size="24">Multi-AZ DB instance：單一 Standby</text>
<text x="320" y="1390" text-anchor="middle" font-size="26">DNS 名稱解析</text>
<g id="dns">
<rect x="40" y="1430" width="250" height="80" rx="16" fill="#eff6ff" stroke="#64748b" stroke-width="2"/>
<text x="165" y="1478" text-anchor="middle" font-size="24">Route 53</text>
</g>
<path d="M290 1470 H350" fill="none" stroke="#0369a1" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#arrow)"/>
<g id="dns-answer">
<rect x="350" y="1430" width="250" height="80" rx="16" fill="#eff6ff" stroke="#64748b" stroke-width="2"/>
<text x="475" y="1462" text-anchor="middle" font-size="24">使用者</text>
<text x="475" y="1494" text-anchor="middle" font-size="24">ALB DNS</text>
</g>
<text x="320" y="1580" text-anchor="middle" font-size="26">關聯 TLS 憑證</text>
<g id="acm">
<rect x="40" y="1620" width="250" height="80" rx="16" fill="#eff6ff" stroke="#64748b" stroke-width="2"/>
<text x="165" y="1668" text-anchor="middle" font-size="24">ACM</text>
</g>
<path d="M290 1660 H350" fill="none" stroke="#0369a1" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#arrow)"/>
<g id="tls-listener">
<rect x="350" y="1620" width="250" height="80" rx="16" fill="#eff6ff" stroke="#64748b" stroke-width="2"/>
<text x="475" y="1652" text-anchor="middle" font-size="24">ALB</text>
<text x="475" y="1684" text-anchor="middle" font-size="24">HTTPS listener</text>
</g>
<text x="320" y="1790" text-anchor="middle" font-size="24">CloudWatch → ASG／選用 SNS</text>
<text x="320" y="1822" text-anchor="middle" font-size="24">IAM 角色 → 兩台 EC2 的權限</text>
</g>
</svg>
