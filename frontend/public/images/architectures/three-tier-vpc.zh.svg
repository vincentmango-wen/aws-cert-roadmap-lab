<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh" width="1000" height="657" viewBox="0 0 1000 657" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">跨兩個可用區的三層 Web 應用</title><desc id="diagram-description">同步複寫 · 對外連線與監控不在請求路徑上。</desc><defs>
<marker id="arrow-https" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8z" fill="#075985"/></marker>
<marker id="arrow-forward" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8z" fill="#075985"/></marker>
<marker id="arrow-dns" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8z" fill="#6d28d9"/></marker>
<marker id="arrow-tls" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8z" fill="#a21caf"/></marker>
<marker id="arrow-schedule" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8z" fill="#92400e"/></marker>
<marker id="arrow-ingress" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8z" fill="#075985"/></marker>
<marker id="arrow-s3-route" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8z" fill="#047857"/></marker>
<marker id="arrow-ddb-route" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8z" fill="#5b21b6"/></marker>
<marker id="arrow-db" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8z" fill="#047857"/></marker>
<marker id="arrow-replicate" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8z" fill="#92400e"/></marker>
</defs><rect width="1000" height="657" fill="#fff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="30" y="39" text-anchor="start" font-size="24" font-weight="700" fill="#0f172a">跨兩個可用區的三層 Web 應用</text>
<rect x="273" y="76" width="701" height="434" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5 4"/>
<text x="291" y="104" text-anchor="start" font-size="15" font-weight="600" fill="#0f172a">VPC</text>
<rect x="289" y="127" width="163" height="344" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
<text x="370" y="153" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">公開子網</text>
<text x="370" y="173" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">AZ A + AZ B</text>
<rect x="465" y="119" width="173" height="143" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
<rect x="465" y="339" width="173" height="143" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="551" y="145" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">AZ A · 應用程式的私有子網</text>
<text x="551" y="365" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">AZ B · 應用程式的私有子網</text>
<rect x="786" y="119" width="173" height="143" rx="12" fill="#faf5ff" stroke="#ddd6fe"/>
<rect x="786" y="339" width="173" height="143" rx="12" fill="#faf5ff" stroke="#ddd6fe"/>
<text x="872" y="145" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">AZ A · 資料庫的私有子網</text>
<text x="872" y="365" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">AZ B · 資料庫的私有子網</text>
<path data-from="client" data-to="igw" data-relationship="https" d="M131 299H155" fill="none" stroke="#075985" stroke-width="2.5" marker-end="url(#arrow-https)"/>
<path data-from="igw" data-to="alb" data-relationship="https" d="M253 299H310" fill="none" stroke="#075985" stroke-width="2.5" marker-end="url(#arrow-https)"/>
<path data-from="alb" data-to="app-a" data-relationship="forward" d="M431 297H457V211H482" fill="none" stroke="#075985" stroke-width="2.5" marker-end="url(#arrow-forward)"/>
<path data-from="alb" data-to="app-b" data-relationship="forward" d="M431 307H457V412H482" fill="none" stroke="#075985" stroke-width="2.5" marker-end="url(#arrow-forward)"/>
<path data-from="app-a" data-to="database-endpoint" data-relationship="db" d="M622 211H650V287H659" fill="none" stroke="#047857" stroke-width="2.5" marker-end="url(#arrow-db)"/>
<path data-from="app-b" data-to="database-endpoint" data-relationship="db" d="M622 412H650V313H659" fill="none" stroke="#047857" stroke-width="2.5" marker-end="url(#arrow-db)"/>
<path data-from="database-endpoint" data-to="primary" data-relationship="db" d="M806 294H829V226" fill="none" stroke="#047857" stroke-width="2.5" marker-end="url(#arrow-db)"/>
<path data-from="primary" data-to="standby" data-relationship="replicate" d="M924 226V235H944V370H924V382" fill="none" stroke="#92400e" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrow-replicate)"/>
<text x="869" y="312" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">同步複寫</text>
<text x="871" y="468" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">不提供讀取</text>
<g id="client">
<rect x="24" y="266" width="107" height="67" rx="12" fill="#e0f2fe" stroke="#0369a1"/>
<text x="77" y="306" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">瀏覽器</text>
</g>
<g id="igw">
<rect x="155" y="266" width="98" height="67" rx="12" fill="#e0f2fe" stroke="#0369a1"/>
<text x="204" y="306" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">IGW</text>
</g>
<text x="203" y="354" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">網際網路閘道</text>
<g id="alb">
<rect x="310" y="266" width="121" height="67" rx="12" fill="#e0f2fe" stroke="#0369a1"/>
<text x="370" y="294" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">公開 ALB</text>
<text x="370" y="315" text-anchor="middle" font-size="14" font-weight="500" fill="#334155">HTTPS</text>
</g>
<g id="app-a">
<rect x="482" y="178" width="140" height="67" rx="12" fill="#d1fae5" stroke="#047857"/>
<text x="552" y="218" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">私有 EC2・A</text>
</g>
<g id="app-b">
<rect x="482" y="379" width="140" height="67" rx="12" fill="#d1fae5" stroke="#047857"/>
<text x="552" y="419" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">私有 EC2・B</text>
</g>
<g id="database-endpoint">
<rect x="659" y="267" width="147" height="67" rx="12" fill="#ede9fe" stroke="#7c3aed"/>
<text x="732" y="307" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">RDS 資料庫端點</text>
</g>
<g id="primary">
<rect x="806" y="159" width="135" height="67" rx="12" fill="#ede9fe" stroke="#7c3aed"/>
<text x="873" y="187" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">RDS</text>
<text x="873" y="208" text-anchor="middle" font-size="14" font-weight="500" fill="#334155">目前主庫</text>
</g>
<g id="standby">
<rect x="806" y="382" width="135" height="67" rx="12" fill="#fef3c7" stroke="#b45309"/>
<text x="873" y="410" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">RDS</text>
<text x="873" y="431" text-anchor="middle" font-size="14" font-weight="500" fill="#334155">單一備援庫</text>
</g>
<rect x="27" y="529" width="947" height="101" rx="12" fill="#fffbeb" stroke="#fde68a"/>
<text x="47" y="555" text-anchor="start" font-size="16" font-weight="700" fill="#0f172a">對外連線與監控不在請求路徑上。</text>
<text x="47" y="584" text-anchor="start" font-size="14" font-weight="500" fill="#0f172a">有公開 IPv4 對外連線需求時，可選用分區 NAT／IGW。</text>
<text x="47" y="609" text-anchor="start" font-size="14" font-weight="500" fill="#0f172a">CloudWatch 監控應用程式與資料庫的運作。</text>
</g></svg>
