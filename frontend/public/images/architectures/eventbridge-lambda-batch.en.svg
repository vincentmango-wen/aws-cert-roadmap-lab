<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1820" viewBox="0 0 640 1820" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">EventBridge + Lambda</title>
<desc id="desc">The diagram uses EventBridge Scheduler for a read-focused scheduled job. Dashed paths are optional features that require their own configuration.</desc>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
<path d="M0 0 L9 4.5 L0 9 Z" fill="#334155"/>
</marker>
</defs>
<rect width="640" height="1820" rx="24" fill="#f8fafc"/>
<g font-family="Arial, 'Yu Gothic', 'Microsoft JhengHei', sans-serif" fill="#0f172a">
<text x="320" y="48" text-anchor="middle" font-size="30">EventBridge + Lambda</text>
<text x="320" y="92" text-anchor="middle" font-size="26">Scheduled batch processing</text>
<g id="scheduler">
<rect x="40" y="140" width="250" height="130" rx="16" fill="#eff6ff" stroke="#64748b" stroke-width="2"/>
<text x="165" y="181" text-anchor="middle" font-size="24">EventBridge</text>
<text x="165" y="213" text-anchor="middle" font-size="24">Scheduler</text>
<text x="165" y="245" text-anchor="middle" font-size="24">cron / rate</text>
</g>
<g id="rule">
<rect x="350" y="140" width="250" height="130" rx="16" fill="#eff6ff" stroke="#64748b" stroke-width="2"/>
<text x="475" y="197" text-anchor="middle" font-size="24">EventBridge Rule</text>
<text x="475" y="229" text-anchor="middle" font-size="24">Optional</text>
</g>
<path d="M165 270 V325 H270 V400" fill="none" stroke="#334155" stroke-width="3"  marker-end="url(#arrow)"/>
<path d="M475 270 V325 H370 V400" fill="none" stroke="#0369a1" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#arrow)"/>
<text x="165" y="365" text-anchor="middle" font-size="24">Schedule</text>
<text x="475" y="365" text-anchor="middle" font-size="24">Event match</text>
<g id="lambda">
<rect x="170" y="400" width="300" height="90" rx="16" fill="#eff6ff" stroke="#64748b" stroke-width="2"/>
<text x="320" y="437" text-anchor="middle" font-size="24">Lambda</text>
<text x="320" y="469" text-anchor="middle" font-size="24">Batch function</text>
</g>
<path d="M320 490 V620" fill="none" stroke="#334155" stroke-width="3"  marker-end="url(#arrow)"/>
<text x="460" y="560" text-anchor="middle" font-size="24">Read only</text>
<g id="dynamodb">
<rect x="170" y="620" width="300" height="90" rx="16" fill="#eff6ff" stroke="#64748b" stroke-width="2"/>
<text x="320" y="673" text-anchor="middle" font-size="24">DynamoDB</text>
</g>
<text x="320" y="810" text-anchor="middle" font-size="26">Log output</text>
<g id="logging-lambda">
<rect x="40" y="850" width="250" height="90" rx="16" fill="#eff6ff" stroke="#64748b" stroke-width="2"/>
<text x="165" y="903" text-anchor="middle" font-size="24">Lambda</text>
</g>
<path d="M290 895 H350" fill="none" stroke="#334155" stroke-width="3"  marker-end="url(#arrow)"/>
<g id="logs">
<rect x="350" y="850" width="250" height="90" rx="16" fill="#eff6ff" stroke="#64748b" stroke-width="2"/>
<text x="475" y="887" text-anchor="middle" font-size="24">CloudWatch</text>
<text x="475" y="919" text-anchor="middle" font-size="24">Logs</text>
</g>
<g id="lambda-metrics">
<rect x="40" y="1040" width="250" height="120" rx="16" fill="#eff6ff" stroke="#64748b" stroke-width="2"/>
<text x="165" y="1092" text-anchor="middle" font-size="24">Lambda</text>
<text x="165" y="1124" text-anchor="middle" font-size="24">Metrics</text>
</g>
<path d="M475 940 V1040" fill="none" stroke="#0369a1" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#arrow)"/>
<g id="log-metrics">
<rect x="350" y="1040" width="250" height="120" rx="16" fill="#eff6ff" stroke="#64748b" stroke-width="2"/>
<text x="475" y="1092" text-anchor="middle" font-size="24">Logs → metric</text>
<text x="475" y="1124" text-anchor="middle" font-size="24">filter</text>
</g>
<path d="M165 1160 V1220 H270 V1280" fill="none" stroke="#0369a1" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#arrow)"/>
<path d="M475 1160 V1220 H370 V1280" fill="none" stroke="#0369a1" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#arrow)"/>
<g id="alarm">
<rect x="170" y="1280" width="300" height="100" rx="16" fill="#fff7ed" stroke="#64748b" stroke-width="2"/>
<text x="320" y="1322" text-anchor="middle" font-size="24">CloudWatch Alarm</text>
<text x="320" y="1354" text-anchor="middle" font-size="24">Optional: configure</text>
</g>
<text x="320" y="1470" text-anchor="middle" font-size="26">Notifications / email (optional)</text>
<g id="notifying-lambda">
<rect x="40" y="1510" width="250" height="90" rx="16" fill="#eff6ff" stroke="#64748b" stroke-width="2"/>
<text x="165" y="1563" text-anchor="middle" font-size="24">Lambda</text>
</g>
<path d="M290 1555 H350" fill="none" stroke="#0369a1" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#arrow)"/>
<g id="destinations">
<rect x="350" y="1510" width="250" height="90" rx="16" fill="#fff7ed" stroke="#64748b" stroke-width="2"/>
<text x="475" y="1547" text-anchor="middle" font-size="24">SNS / SES</text>
<text x="475" y="1579" text-anchor="middle" font-size="24">Optional</text>
</g>
<text x="320" y="1690" text-anchor="middle" font-size="24">IAM: Lambda execution permissions</text>
<text x="320" y="1722" text-anchor="middle" font-size="24">Budgets: cost and usage monitoring</text>
<text x="320" y="1754" text-anchor="middle" font-size="24">Future design example, not deployed</text>
</g>
</svg>
