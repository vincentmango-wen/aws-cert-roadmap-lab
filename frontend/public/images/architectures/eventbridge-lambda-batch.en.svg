<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="890" viewBox="0 0 1000 890" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">EventBridge + Lambda</title>
<desc id="desc">The diagram uses EventBridge Scheduler for a read-focused scheduled job. Dashed paths are optional features that require their own configuration.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#334155"/></marker></defs>
<rect width="1000" height="890" rx="20" fill="#f8fafc"/>
<g font-family="Arial, 'Yu Gothic', 'Microsoft JhengHei', sans-serif" fill="#0f172a" font-size="15">
<text x="500" y="35" text-anchor="middle" font-size="22" font-weight="400">EventBridge + Lambda</text>
<rect x="13.3333" y="60" width="973.333" height="275" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="500" y="86" text-anchor="middle" font-size="17" font-weight="400">Scheduled batch processing</text>
<g id="scheduler">
<rect x="29.1667" y="105" width="183.333" height="88" rx="12" fill="#ede9fe" stroke="#8b5cf6"/>
<text x="120.833" y="134.0" text-anchor="middle" font-size="15" font-weight="600">EventBridge</text>
<text x="120.833" y="154.0" text-anchor="middle" font-size="15" font-weight="400">Scheduler</text>
<text x="120.833" y="174.0" text-anchor="middle" font-size="15" font-weight="400">cron / rate</text>
</g>
<g id="rule">
<rect x="29.1667" y="235" width="183.333" height="72" rx="12" fill="#ede9fe" stroke="#8b5cf6"/>
<text x="120.833" y="266.0" text-anchor="middle" font-size="15" font-weight="600">EventBridge Rule</text>
<text x="120.833" y="286.0" text-anchor="middle" font-size="15" font-weight="400">Optional</text>
</g>
<g id="lambda">
<rect x="400" y="170" width="183.333" height="76" rx="12" fill="#eff6ff" stroke="#60a5fa"/>
<text x="491.667" y="203.0" text-anchor="middle" font-size="15" font-weight="600">Lambda</text>
<text x="491.667" y="223.0" text-anchor="middle" font-size="15" font-weight="400">Batch function</text>
</g>
<g id="dynamodb">
<rect x="775" y="170" width="191.667" height="76" rx="12" fill="#ecfdf5" stroke="#34d399"/>
<text x="870.833" y="213.0" text-anchor="middle" font-size="15" font-weight="600">DynamoDB</text>
</g>
<path data-from="scheduler" data-to="lambda" d="M212.5 149 H308.333 V190 H400" fill="none" stroke="#334155" stroke-width="1.66667" marker-end="url(#arrow)"/>
<path data-from="rule" data-to="lambda" d="M212.5 271 H325 V226 H400" fill="none" stroke="#334155" stroke-width="1.66667" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="275" y="135" text-anchor="middle" font-size="15" font-weight="400">Schedule</text>
<text x="275" y="294" text-anchor="middle" font-size="15" font-weight="400">Event match</text>
<path data-from="lambda" data-to="dynamodb" d="M583.333 208 H775" fill="none" stroke="#334155" stroke-width="1.66667" marker-end="url(#arrow)"/>
<text x="679.167" y="195" text-anchor="middle" font-size="15" font-weight="400">Read only</text>
<rect x="13.3333" y="350" width="973.333" height="300" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="125" y="377" text-anchor="middle" font-size="17" font-weight="400">Log output</text>
<g id="logging-lambda">
<rect x="29.1667" y="400" width="150" height="66" rx="12" fill="#eff6ff" stroke="#60a5fa"/>
<text x="104.167" y="438.0" text-anchor="middle" font-size="15" font-weight="600">Lambda</text>
</g>
<g id="logs">
<rect x="250" y="400" width="158.333" height="66" rx="12" fill="#ede9fe" stroke="#8b5cf6"/>
<text x="329.167" y="428.0" text-anchor="middle" font-size="15" font-weight="600">CloudWatch</text>
<text x="329.167" y="448.0" text-anchor="middle" font-size="15" font-weight="400">Logs</text>
</g>
<g id="log-metrics">
<rect x="483.333" y="400" width="200" height="76" rx="12" fill="#ede9fe" stroke="#8b5cf6"/>
<text x="583.333" y="433.0" text-anchor="middle" font-size="15" font-weight="600">Logs → metric</text>
<text x="583.333" y="453.0" text-anchor="middle" font-size="15" font-weight="400">filter</text>
</g>
<g id="lambda-metrics">
<rect x="483.333" y="550" width="200" height="76" rx="12" fill="#ede9fe" stroke="#8b5cf6"/>
<text x="583.333" y="583.0" text-anchor="middle" font-size="15" font-weight="600">Lambda</text>
<text x="583.333" y="603.0" text-anchor="middle" font-size="15" font-weight="400">Metrics</text>
</g>
<g id="alarm">
<rect x="775" y="470" width="200" height="86" rx="12" fill="#ede9fe" stroke="#8b5cf6"/>
<text x="875" y="508.0" text-anchor="middle" font-size="15" font-weight="600">CloudWatch Alarm</text>
<text x="875" y="528.0" text-anchor="middle" font-size="15" font-weight="400">Optional: configure</text>
</g>
<path data-from="logging-lambda" data-to="logs" d="M179.167 433 H250" fill="none" stroke="#334155" stroke-width="1.66667" marker-end="url(#arrow)"/>
<path data-from="logs" data-to="log-metrics" d="M408.333 433 H483.333" fill="none" stroke="#334155" stroke-width="1.66667" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<path data-from="log-metrics" data-to="alarm" d="M683.333 438 H729.167 V490 H775" fill="none" stroke="#334155" stroke-width="1.66667" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<path data-from="lambda-metrics" data-to="alarm" d="M683.333 588 H729.167 V536 H775" fill="none" stroke="#334155" stroke-width="1.66667" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="13.3333" y="665" width="973.333" height="135" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="500" y="692" text-anchor="middle" font-size="17" font-weight="400">Notifications / email (optional)</text>
<g id="notifying-lambda">
<rect x="141.667" y="715" width="183.333" height="66" rx="12" fill="#eff6ff" stroke="#60a5fa"/>
<text x="233.333" y="753.0" text-anchor="middle" font-size="15" font-weight="600">Lambda</text>
</g>
<g id="destinations">
<rect x="616.667" y="715" width="208.333" height="66" rx="12" fill="#ede9fe" stroke="#8b5cf6"/>
<text x="720.833" y="743.0" text-anchor="middle" font-size="15" font-weight="600">SNS / SES</text>
<text x="720.833" y="763.0" text-anchor="middle" font-size="15" font-weight="400">Optional</text>
</g>
<path data-from="notifying-lambda" data-to="destinations" d="M325 748 H616.667" fill="none" stroke="#334155" stroke-width="1.66667" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="500" y="825" text-anchor="middle" font-size="15" font-weight="400">IAM: Lambda execution permissions</text>
<text x="500" y="850" text-anchor="middle" font-size="15" font-weight="400">Budgets: cost and usage monitoring</text>
<text x="500" y="875" text-anchor="middle" font-size="15" font-weight="400">Future design example, not deployed</text>
</g>
</svg>
