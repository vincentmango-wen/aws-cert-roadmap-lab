<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" viewBox="0 0 1040 420" role="img" aria-labelledby="title desc" xml:lang="zh">
<title id="title">SQS + Lambda 非同步處理</title>
<desc id="desc">業務處理為非同步；事件來源映射會同步呼叫 Lambda。 已設定 redrive policy / maxReceiveCount：訊息接收次數</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="9" refY="5" viewBox="0 0 10 10" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#445469"/></marker></defs>
<rect width="1040" height="420" rx="16" fill="#f8fafc"/>
<g font-family="Arial, Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" fill="#17253a">
<text x="22" y="32" text-anchor="start" font-size="21">SQS + Lambda 非同步處理</text>
<text x="22" y="58" text-anchor="start" font-size="14">請求接收與工作函式處理解耦</text>
<g id="request"><rect x="20" y="125" width="112" height="64" rx="10" fill="#ffffff" stroke="#aab9cb"/>
<text x="76.0" y="151.5" text-anchor="middle" font-size="14">使用者／</text>
<text x="76.0" y="170.5" text-anchor="middle" font-size="14">外部系統</text>
</g>
<g id="api"><rect x="164" y="125" width="128" height="64" rx="10" fill="#eff6ff" stroke="#60a5fa"/>
<text x="228.0" y="151.5" text-anchor="middle" font-size="14">API／</text>
<text x="228.0" y="170.5" text-anchor="middle" font-size="14">應用程式</text>
</g>
<g id="queue"><rect x="356" y="125" width="108" height="64" rx="10" fill="#fef3c7" stroke="#b3670c"/>
<text x="410.0" y="161.0" text-anchor="middle" font-size="14">SQS 佇列</text>
</g>
<g id="mapping"><rect x="528" y="125" width="146" height="64" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-dasharray="4 3"/>
<text x="601.0" y="151.5" text-anchor="middle" font-size="14">Lambda</text>
<text x="601.0" y="170.5" text-anchor="middle" font-size="14">事件來源映射</text>
</g>
<g id="worker"><rect x="754" y="125" width="132" height="64" rx="10" fill="#eff6ff" stroke="#60a5fa"/>
<text x="820.0" y="161.0" text-anchor="middle" font-size="14">Lambda 工作函式</text>
</g>
<g id="result"><rect x="920" y="125" width="100" height="64" rx="10" fill="#ecfdf5" stroke="#34d399"/>
<text x="970.0" y="151.5" text-anchor="middle" font-size="14">DynamoDB／</text>
<text x="970.0" y="170.5" text-anchor="middle" font-size="14">儲存目的地</text>
</g>
<path id="request-to-api" d="M132 157 H164" fill="none" stroke="#445469" stroke-width="2" marker-end="url(#arrow)"/>
<path id="send-message" d="M292 157 H356" fill="none" stroke="#445469" stroke-width="2" marker-end="url(#arrow)"/>
<text x="324" y="105" text-anchor="middle" font-size="12">傳送訊息</text>
<path id="poll" d="M528 157 H464" fill="none" stroke="#445469" stroke-width="2" marker-end="url(#arrow)"/>
<text x="496" y="105" text-anchor="middle" font-size="12">輪詢</text>
<path id="sync-invoke" d="M674 157 H754" fill="none" stroke="#445469" stroke-width="2" marker-end="url(#arrow)"/>
<text x="714" y="105" text-anchor="middle" font-size="12">同步呼叫</text>
<path id="save-result" d="M886 157 H920" fill="none" stroke="#445469" stroke-width="2" marker-end="url(#arrow)"/>
<text x="970" y="105" text-anchor="middle" font-size="12">儲存結果</text>
<g id="logs"><rect x="742" y="276" width="158" height="64" rx="10" fill="#ffffff" stroke="#aab9cb"/>
<text x="821.0" y="312.0" text-anchor="middle" font-size="14">CloudWatch Logs</text>
</g>
<path id="log-output" d="M820 189 V276" fill="none" stroke="#445469" stroke-width="2" marker-end="url(#arrow)"/>
<text x="875" y="240" text-anchor="middle" font-size="12">日誌輸出</text>
<g id="dlq"><rect x="356" y="276" width="108" height="64" rx="10" fill="#fef3c7" stroke="#b3670c"/>
<text x="410.0" y="312.0" text-anchor="middle" font-size="14">DLQ</text>
</g>
<path id="redrive" d="M410 189 V276" fill="none" stroke="#445469" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="430" y="224" text-anchor="start" font-size="12">已設定 redrive policy</text>
<text x="430" y="243" text-anchor="start" font-size="12">maxReceiveCount：訊息接收次數</text>
<text x="22" y="390" text-anchor="start" font-size="14">業務處理為非同步；事件來源映射會同步呼叫 Lambda。</text>
</g>
</svg>
