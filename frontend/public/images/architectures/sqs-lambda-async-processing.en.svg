<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">SQS Lambda asynchronous processing architecture</title>
  <desc id="desc">Application sends messages to SQS and Lambda processes them asynchronously with dead letter queue.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}
      .box{fill:#ffffff;stroke:#cbd5e1;stroke-width:2}
      .aws{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}
      .queue{fill:#fef3c7;stroke:#f59e0b;stroke-width:2}
      .store{fill:#ecfdf5;stroke:#34d399;stroke-width:2}
      .title{font:700 26px sans-serif;fill:#0f172a}
      .label{font:700 18px sans-serif;fill:#0f172a}
      .small{font:500 14px sans-serif;fill:#475569}
      .line{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#64748b;stroke-width:2;stroke-dasharray:8 6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1200" height="680" rx="28"/>
  <text class="title" x="60" y="58">SQS + Lambda Asynchronous Processing</text>

  <rect class="box" x="70" y="250" width="190" height="90" rx="16"/>
  <text class="label" x="130" y="292">Client</text>
  <text class="small" x="115" y="318">User / System</text>

  <rect class="aws" x="330" y="250" width="200" height="90" rx="16"/>
  <text class="label" x="365" y="292">API / App</text>
  <text class="small" x="360" y="318">Request Receiver</text>

  <rect class="queue" x="600" y="235" width="220" height="120" rx="18"/>
  <text class="label" x="650" y="284">Amazon SQS</text>
  <text class="small" x="655" y="312">Message Queue</text>

  <rect class="aws" x="890" y="235" width="220" height="120" rx="18"/>
  <text class="label" x="940" y="284">AWS Lambda</text>
  <text class="small" x="946" y="312">Worker</text>

  <rect class="store" x="890" y="430" width="220" height="90" rx="16"/>
  <text class="label" x="938" y="472">DynamoDB</text>
  <text class="small" x="942" y="498">Store Results</text>

  <rect class="queue" x="600" y="430" width="220" height="90" rx="16"/>
  <text class="label" x="684" y="472">DLQ</text>
  <text class="small" x="655" y="498">Failed Message Queue</text>

  <rect class="box" x="890" y="110" width="220" height="80" rx="16"/>
  <text class="label" x="930" y="153">CloudWatch</text>
  <text class="small" x="957" y="177">Logs</text>

  <path class="line" d="M260 295 H330"/>
  <path class="line" d="M530 295 H600"/>
  <path class="line" d="M820 295 H890"/>
  <path class="line" d="M1000 355 V430"/>
  <path class="dash" d="M710 355 V430"/>
  <path class="dash" d="M1000 235 V190"/>
  <text class="small" x="92" y="592">Point: Decouple receiving from processing to handle traffic spikes, transient failures, and retries</text>
</svg>
