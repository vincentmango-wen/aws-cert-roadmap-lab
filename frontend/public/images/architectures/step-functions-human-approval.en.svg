<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1280" role="img" aria-labelledby="title desc" lang="en"><title id="title">Order approval · Standard</title><desc id="desc">Logical flow · 48-hour callback. Tokens stay in protected storage. Task Catch does not catch the overall execution timeout. Dashed paths require reconciliation; no automatic rollback.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,'Noto Sans',sans-serif;fill:#0f172a} .edge{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#arrow)} .label{font-size:18px;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round}</style><rect width="640" height="1280" rx="20" fill="#f8fafc"/><text x="320" y="42" text-anchor="middle" font-size="25" font-weight="700">Order approval · Standard</text><text x="320" y="74" text-anchor="middle" font-size="18">Logical flow · 48-hour callback</text><path class="edge" d="M320 202 V242"/><path class="edge" d="M320 324 V364"/><path class="edge" d="M320 446 V506"/><text class="label" x="320" y="481" text-anchor="middle">Notify / wait</text><path class="edge" d="M320 588 V648"/><text class="label" x="320" y="625" text-anchor="middle">Valid callback</text><path class="edge" d="M320 730 V770 H112 V830"/><text class="label" x="112" y="800" text-anchor="middle">Approve</text><path class="edge" d="M320 730 V830"/><text class="label" x="320" y="800" text-anchor="middle">Reject</text><path class="edge" d="M480 405 H624 V871 H614"/><text class="label" x="601" y="470" text-anchor="middle">48h</text><path class="edge" d="M112 912 V998 H320 V1050" stroke-dasharray="6 5"/><path class="edge" d="M320 912 V1050" stroke-dasharray="6 5"/><text class="label" x="320" y="975" text-anchor="middle">Uncertain / failed</text><path class="edge" d="M524 912 V998 H320" stroke-dasharray="6 5"/><g id="node-A"><rect x="160" y="120" width="320" height="82" rx="12" fill="#dbeafe" stroke="#475569" stroke-width="1.5"/><text x="320" y="152" text-anchor="middle" font-size="22" font-weight="700">A · Order entry</text><text x="320" y="181" text-anchor="middle" font-size="18">Authenticate + validate</text></g><g id="node-B"><rect x="160" y="242" width="320" height="82" rx="12" fill="#dbeafe" stroke="#475569" stroke-width="1.5"/><text x="320" y="274" text-anchor="middle" font-size="22" font-weight="700">B · Reserve inventory</text><text x="320" y="303" text-anchor="middle" font-size="18">Idempotent operation</text></g><g id="node-C"><rect x="160" y="364" width="320" height="82" rx="12" fill="#e0e7ff" stroke="#475569" stroke-width="1.5"/><text x="320" y="396" text-anchor="middle" font-size="22" font-weight="700">C · Wait for approval</text><text x="320" y="425" text-anchor="middle" font-size="18">Task token · 48 hours</text></g><g id="node-D"><rect x="160" y="506" width="320" height="82" rx="12" fill="#e0e7ff" stroke="#475569" stroke-width="1.5"/><text x="320" y="538" text-anchor="middle" font-size="22" font-weight="700">D · Approval broker</text><text x="320" y="567" text-anchor="middle" font-size="18">Login + decision + callback</text></g><g id="node-E"><rect x="160" y="648" width="320" height="82" rx="12" fill="#e0e7ff" stroke="#475569" stroke-width="1.5"/><text x="320" y="680" text-anchor="middle" font-size="22" font-weight="700">E · Decision</text><text x="320" y="709" text-anchor="middle" font-size="18">Validate approved flag</text></g><g id="node-F"><rect x="22" y="830" width="180" height="82" rx="12" fill="#dcfce7" stroke="#475569" stroke-width="1.5"/><text x="112" y="862" text-anchor="middle" font-size="19" font-weight="700">F · Confirm</text><text x="112" y="891" text-anchor="middle" font-size="17">Order approved</text></g><g id="node-G"><rect x="230" y="830" width="180" height="82" rx="12" fill="#fef3c7" stroke="#475569" stroke-width="1.5"/><text x="320" y="862" text-anchor="middle" font-size="19" font-weight="700">G · Release</text><text x="320" y="891" text-anchor="middle" font-size="17">Order rejected</text></g><g id="node-H"><rect x="434" y="830" width="180" height="82" rx="12" fill="#ffedd5" stroke="#475569" stroke-width="1.5"/><text x="524" y="862" text-anchor="middle" font-size="19" font-weight="700">H · Release</text><text x="524" y="891" text-anchor="middle" font-size="17">Wait expired</text></g><g id="node-I"><rect x="100" y="1050" width="440" height="82" rx="12" fill="#ffe4e6" stroke="#475569" stroke-width="1.5"/><text x="320" y="1082" text-anchor="middle" font-size="22" font-weight="700">I · Reconcile / manual review</text><text x="320" y="1111" text-anchor="middle" font-size="18">Uncertain result or failed compensation</text></g><text x="320" y="1174" text-anchor="middle" font-size="17">Tokens stay in protected storage.</text><text x="320" y="1204" text-anchor="middle" font-size="17">Task Catch does not catch the overall execution timeout.</text><text x="320" y="1234" text-anchor="middle" font-size="17">Dashed paths require reconciliation; no automatic rollback.</text></svg>
