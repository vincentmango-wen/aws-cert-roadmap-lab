<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="diagram-title diagram-description" xml:lang="en">
  <title id="diagram-title">Static website delivery and deployment</title>
  <desc id="diagram-description">Browser HTTPS reaches CloudFront; CloudFront can read private S3 using OAC. Optional DNS and TLS and a separate deployment path are shown.</desc>
  <defs>
    <marker id="arrow-viewer" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8z" fill="#075985"/></marker>
    <marker id="arrow-origin" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8z" fill="#047857"/></marker>
    <marker id="arrow-dns" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8z" fill="#6d28d9"/></marker>
    <marker id="arrow-tls" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8z" fill="#a21caf"/></marker>
    <marker id="arrow-deployment" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8z" fill="#92400e"/></marker>
    <marker id="arrow-form-load" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8z" fill="#075985"/></marker>
    <marker id="arrow-submit" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8z" fill="#075985"/></marker>
    <marker id="arrow-invoke" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8z" fill="#6d28d9"/></marker>
    <marker id="arrow-write" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8z" fill="#047857"/></marker>
  </defs>
  <rect width="1000" height="520" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="32" y="42" font-size="25" font-weight="700" text-anchor="start" fill="#0f172a">Static website delivery and deployment</text>
    <rect x="25" y="68" width="950" height="110" rx="12" fill="#faf5ff" stroke="#e9d5ff"/>
    <rect x="25" y="194" width="950" height="139" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="25" y="349" width="950" height="144" rx="12" fill="#fffbeb" stroke="#fde68a"/>
    <text x="42" y="95" font-size="15" font-weight="600" text-anchor="start" fill="#0f172a">Optional custom domain</text>
    <text x="42" y="218" font-size="15" font-weight="600" text-anchor="start" fill="#0f172a">Read path</text>
    <text x="42" y="376" font-size="15" font-weight="600" text-anchor="start" fill="#0f172a">Deployment (not viewer traffic)</text>
    <path data-from="browser" data-to="cloudfront" data-relationship="viewer" d="M239 274H418" fill="none" stroke="#075985" stroke-width="2.5" marker-end="url(#arrow-viewer)"/>
    <text x="330" y="258" font-size="15" font-weight="600" text-anchor="middle" fill="#075985">HTTPS</text>
    <path data-from="cloudfront" data-to="s3" data-relationship="origin" d="M596 274H758" fill="none" stroke="#047857" stroke-width="2.5" marker-end="url(#arrow-origin)"/>
    <text x="677" y="258" font-size="15" font-weight="600" text-anchor="middle" fill="#047857">OAC-signed read</text>
    <path data-from="route53" data-to="cloudfront" data-relationship="dns" d="M409 162V188H459V239" fill="none" stroke="#6d28d9" stroke-width="2.5" stroke-dasharray="2 5" marker-end="url(#arrow-dns)"/>
    <text x="397" y="184" font-size="15" font-weight="600" text-anchor="end" fill="#6d28d9">DNS alias</text>
    <path data-from="acm" data-to="cloudfront" data-relationship="tls" d="M651 162V204H555V239" fill="none" stroke="#a21caf" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrow-tls)"/>
    <text x="663" y="194" font-size="15" font-weight="600" text-anchor="start" fill="#a21caf">TLS association</text>
    <path data-from="actions" data-to="deploy-role" data-relationship="deployment" d="M239 435H418" fill="none" stroke="#92400e" stroke-width="2.5" stroke-dasharray="12 5" marker-end="url(#arrow-deployment)"/>
    <text x="330" y="420" font-size="15" font-weight="600" text-anchor="middle" fill="#92400e">Build / deploy</text>
    <path data-from="deploy-role" data-to="s3" data-relationship="deployment" d="M596 435H847V309" fill="none" stroke="#92400e" stroke-width="2.5" stroke-dasharray="12 5" marker-end="url(#arrow-deployment)"/>
    <text x="733" y="423" font-size="15" font-weight="600" text-anchor="middle" fill="#92400e">S3 sync</text>
    <path data-from="deploy-role" data-to="cloudfront" data-relationship="deployment" d="M507 400V309" fill="none" stroke="#92400e" stroke-width="2.5" stroke-dasharray="12 5" marker-end="url(#arrow-deployment)"/>
    <text x="520" y="330" font-size="15" font-weight="600" text-anchor="start" fill="#92400e">Cache invalidation</text>
    <g id="browser">
    <rect x="61" y="239" width="178" height="70" rx="12" fill="#e0f2fe" stroke="#64748b"/>
    <text x="150" y="267" font-size="17" font-weight="600" text-anchor="middle" fill="#0f172a">Browser</text>
    <text x="150" y="290" font-size="15" font-weight="500" text-anchor="middle" fill="#334155">Site visitor</text>
    </g>
    <g id="cloudfront">
    <rect x="418" y="239" width="178" height="70" rx="12" fill="#ede9fe" stroke="#64748b"/>
    <text x="507" y="267" font-size="17" font-weight="600" text-anchor="middle" fill="#0f172a">CloudFront</text>
    <text x="507" y="290" font-size="15" font-weight="500" text-anchor="middle" fill="#334155">HTTPS · cache</text>
    </g>
    <g id="s3">
    <rect x="758" y="239" width="178" height="70" rx="12" fill="#d1fae5" stroke="#64748b"/>
    <text x="847" y="267" font-size="17" font-weight="600" text-anchor="middle" fill="#0f172a">Private S3 bucket</text>
    <text x="847" y="290" font-size="15" font-weight="500" text-anchor="middle" fill="#334155">Static files</text>
    </g>
    <g id="route53">
    <rect x="320" y="92" width="178" height="70" rx="12" fill="#f5f3ff" stroke="#64748b"/>
    <text x="409" y="120" font-size="17" font-weight="600" text-anchor="middle" fill="#0f172a">Route 53</text>
    <text x="409" y="143" font-size="15" font-weight="500" text-anchor="middle" fill="#334155">Optional alias DNS</text>
    </g>
    <g id="acm">
    <rect x="562" y="92" width="178" height="70" rx="12" fill="#fce7f3" stroke="#64748b"/>
    <text x="651" y="120" font-size="17" font-weight="600" text-anchor="middle" fill="#0f172a">ACM certificate</text>
    <text x="651" y="143" font-size="15" font-weight="500" text-anchor="middle" fill="#334155">For custom domains</text>
    </g>
    <g id="actions">
    <rect x="61" y="400" width="178" height="70" rx="12" fill="#fef3c7" stroke="#64748b"/>
    <text x="150" y="428" font-size="17" font-weight="600" text-anchor="middle" fill="#0f172a">GitHub Actions</text>
    <text x="150" y="451" font-size="15" font-weight="500" text-anchor="middle" fill="#334155">Build static output</text>
    </g>
    <g id="deploy-role">
    <rect x="418" y="400" width="178" height="70" rx="12" fill="#fef3c7" stroke="#64748b"/>
    <text x="507" y="428" font-size="17" font-weight="600" text-anchor="middle" fill="#0f172a">IAM deploy role</text>
    <text x="507" y="451" font-size="15" font-weight="500" text-anchor="middle" fill="#334155">Deploy permissions</text>
    </g>
  </g>
</svg>
