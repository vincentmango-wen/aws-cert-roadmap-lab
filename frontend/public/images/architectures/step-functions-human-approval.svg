<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1280" role="img" aria-labelledby="title desc" lang="ja"><title id="title">注文の人手による承認 · Standard</title><desc id="desc">論理フロー · 48時間のcallback. Tokenは保護された保存先だけに保持。 Task Catchは実行全体のtimeoutを捕捉できません。 破線は照合が必要。自動ロールバックではありません。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,'Noto Sans',sans-serif;fill:#0f172a} .edge{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#arrow)} .label{font-size:18px;paint-order:stroke;stroke:#f8fafc;stroke-width:6px;stroke-linejoin:round}</style><rect width="640" height="1280" rx="20" fill="#f8fafc"/><text x="320" y="42" text-anchor="middle" font-size="25" font-weight="700">注文の人手による承認 · Standard</text><text x="320" y="74" text-anchor="middle" font-size="18">論理フロー · 48時間のcallback</text><path class="edge" d="M320 202 V242"/><path class="edge" d="M320 324 V364"/><path class="edge" d="M320 446 V506"/><text class="label" x="320" y="481" text-anchor="middle">通知／待機</text><path class="edge" d="M320 588 V648"/><text class="label" x="320" y="625" text-anchor="middle">有効なcallback</text><path class="edge" d="M320 730 V770 H112 V830"/><text class="label" x="112" y="800" text-anchor="middle">承認</text><path class="edge" d="M320 730 V830"/><text class="label" x="320" y="800" text-anchor="middle">拒否</text><path class="edge" d="M480 405 H624 V871 H614"/><text class="label" x="601" y="470" text-anchor="middle">48h</text><path class="edge" d="M112 912 V998 H320 V1050" stroke-dasharray="6 5"/><path class="edge" d="M320 912 V1050" stroke-dasharray="6 5"/><text class="label" x="320" y="975" text-anchor="middle">不明／失敗</text><path class="edge" d="M524 912 V998 H320" stroke-dasharray="6 5"/><g id="node-A"><rect x="160" y="120" width="320" height="82" rx="12" fill="#dbeafe" stroke="#475569" stroke-width="1.5"/><text x="320" y="152" text-anchor="middle" font-size="22" font-weight="700">A · 注文受付</text><text x="320" y="181" text-anchor="middle" font-size="18">認証と入力の検証</text></g><g id="node-B"><rect x="160" y="242" width="320" height="82" rx="12" fill="#dbeafe" stroke="#475569" stroke-width="1.5"/><text x="320" y="274" text-anchor="middle" font-size="22" font-weight="700">B · 在庫確保</text><text x="320" y="303" text-anchor="middle" font-size="18">冪等な操作キー</text></g><g id="node-C"><rect x="160" y="364" width="320" height="82" rx="12" fill="#e0e7ff" stroke="#475569" stroke-width="1.5"/><text x="320" y="396" text-anchor="middle" font-size="22" font-weight="700">C · 承認待ち</text><text x="320" y="425" text-anchor="middle" font-size="18">Task token · 48時間</text></g><g id="node-D"><rect x="160" y="506" width="320" height="82" rx="12" fill="#e0e7ff" stroke="#475569" stroke-width="1.5"/><text x="320" y="538" text-anchor="middle" font-size="22" font-weight="700">D · 承認broker</text><text x="320" y="567" text-anchor="middle" font-size="18">ログイン・判断・callback</text></g><g id="node-E"><rect x="160" y="648" width="320" height="82" rx="12" fill="#e0e7ff" stroke="#475569" stroke-width="1.5"/><text x="320" y="680" text-anchor="middle" font-size="22" font-weight="700">E · 回答判定</text><text x="320" y="709" text-anchor="middle" font-size="18">approvedを検証</text></g><g id="node-F"><rect x="22" y="830" width="180" height="82" rx="12" fill="#dcfce7" stroke="#475569" stroke-width="1.5"/><text x="112" y="862" text-anchor="middle" font-size="19" font-weight="700">F · 注文確定</text><text x="112" y="891" text-anchor="middle" font-size="17">承認済み</text></g><g id="node-G"><rect x="230" y="830" width="180" height="82" rx="12" fill="#fef3c7" stroke="#475569" stroke-width="1.5"/><text x="320" y="862" text-anchor="middle" font-size="19" font-weight="700">G · 在庫解放</text><text x="320" y="891" text-anchor="middle" font-size="17">拒否</text></g><g id="node-H"><rect x="434" y="830" width="180" height="82" rx="12" fill="#ffedd5" stroke="#475569" stroke-width="1.5"/><text x="524" y="862" text-anchor="middle" font-size="19" font-weight="700">H · 在庫解放</text><text x="524" y="891" text-anchor="middle" font-size="17">期限切れ</text></g><g id="node-I"><rect x="100" y="1050" width="440" height="82" rx="12" fill="#ffe4e6" stroke="#475569" stroke-width="1.5"/><text x="320" y="1082" text-anchor="middle" font-size="22" font-weight="700">I · 照合／手動対応</text><text x="320" y="1111" text-anchor="middle" font-size="18">結果不明または補償失敗</text></g><text x="320" y="1174" text-anchor="middle" font-size="17">Tokenは保護された保存先だけに保持。</text><text x="320" y="1204" text-anchor="middle" font-size="17">Task Catchは実行全体のtimeoutを捕捉できません。</text><text x="320" y="1234" text-anchor="middle" font-size="17">破線は照合が必要。自動ロールバックではありません。</text></svg>
