<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1780" viewBox="0 0 640 1780" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">SQS + Lambda</title>
<desc id="desc">Synchronous invocation. Permissions and DLQ configuration are explained in the flow table.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#334155"/></marker></defs>
<rect width="640" height="1780" rx="24" fill="#f8fafc"/>
<g font-family="Arial, Noto Sans CJK TC, Noto Sans CJK JP, sans-serif" fill="#0f172a">
<text x="320" y="50" text-anchor="middle" font-size="34">SQS + Lambda</text>
<g id="request"><rect x="90" y="90" width="460" height="100" rx="14" fill="#eff6ff" stroke="#64748b" stroke-width="2"/>
<text x="320.0" y="150.0" text-anchor="middle" font-size="30">User / external system</text>
</g>
<path d="M320 190 V230" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<g id="api"><rect x="90" y="230" width="460" height="100" rx="14" fill="#eff6ff" stroke="#64748b" stroke-width="2"/>
<text x="320.0" y="290.0" text-anchor="middle" font-size="30">API / application</text>
</g>
<path d="M320 330 V410" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<text x="465" y="378" text-anchor="middle" font-size="26">Send message</text>
<g id="queue"><rect x="90" y="410" width="460" height="100" rx="14" fill="#eff6ff" stroke="#64748b" stroke-width="2"/>
<text x="320.0" y="470.0" text-anchor="middle" font-size="30">SQS queue</text>
</g>
<path d="M320 510 V550" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<g id="mapping"><rect x="90" y="550" width="460" height="120" rx="14" fill="#eff6ff" stroke="#64748b" stroke-width="2"/>
<text x="320.0" y="602.0" text-anchor="middle" font-size="30">Lambda event source</text>
<text x="320.0" y="638.0" text-anchor="middle" font-size="30">mapping (polling)</text>
</g>
<path d="M320 724 V750" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<text x="320" y="718" text-anchor="middle" font-size="26">Synchronous invocation</text>
<g id="worker"><rect x="90" y="750" width="460" height="100" rx="14" fill="#eff6ff" stroke="#64748b" stroke-width="2"/>
<text x="320.0" y="810.0" text-anchor="middle" font-size="30">Lambda worker</text>
</g>
<path d="M320 850 V890" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<g id="result"><rect x="90" y="890" width="460" height="100" rx="14" fill="#eff6ff" stroke="#64748b" stroke-width="2"/>
<text x="320.0" y="950.0" text-anchor="middle" font-size="30">DynamoDB / storage</text>
</g>
<text x="320" y="1070" text-anchor="middle" font-size="30">Log output</text>
<g id="logging-worker"><rect x="90" y="1110" width="460" height="100" rx="14" fill="#eff6ff" stroke="#64748b" stroke-width="2"/>
<text x="320.0" y="1170.0" text-anchor="middle" font-size="30">Lambda worker</text>
</g>
<path d="M320 1210 V1250" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<g id="logs"><rect x="90" y="1250" width="460" height="100" rx="14" fill="#eff6ff" stroke="#64748b" stroke-width="2"/>
<text x="320.0" y="1310.0" text-anchor="middle" font-size="30">CloudWatch Logs</text>
</g>
<text x="320" y="1420" text-anchor="middle" font-size="28">Configured redrive</text>
<text x="320" y="1456" text-anchor="middle" font-size="28">maxReceiveCount</text>
<g id="redrive-source"><rect x="30" y="1500" width="260" height="100" rx="14" fill="#eff6ff" stroke="#64748b" stroke-width="2"/>
<text x="160.0" y="1560.0" text-anchor="middle" font-size="30">SQS queue</text>
</g>
<g id="dlq"><rect x="370" y="1500" width="240" height="100" rx="14" fill="#fff7ed" stroke="#64748b" stroke-width="2"/>
<text x="490.0" y="1560.0" text-anchor="middle" font-size="30">DLQ</text>
</g>
<path d="M290 1550 H370" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#arrow)"/>
<text x="320" y="1680" text-anchor="middle" font-size="28">Permissions and DLQ configuration</text>
<text x="320" y="1716" text-anchor="middle" font-size="28">are explained in the flow table.</text>
</g>
</svg>
